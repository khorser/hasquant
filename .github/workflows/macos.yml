name: MacOS

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        ghc: ["9.6.7", "9.8.4", "9.10.3"]
        os:
          - macos-15-intel
          - macos-latest

    runs-on: ${{ matrix.os }}

    env:
      GHC_VERSION: ${{ matrix.ghc }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up GHC and cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: 'recommended'
          enable-stack: true
          stack-version: 'latest'

      - name: Install dependencies via Homebrew
        run: |
          HOMEBREW_NO_AUTO_UPDATE=0 brew update --force
          brew install quantlib

      - name: Build and test
        run: |
          case "${{ matrix.ghc }}" in
            9.6.7)
              stack build --resolver lts-22.44 --system-ghc --test ;;
            *)
              cabal update && cabal build all && cabal test all ;;
          esac
