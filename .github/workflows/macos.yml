name: MacOS

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        ghc: ["9.8.4", "9.10.3"]
        os:
          - macos-15-intel
          - macos-latest

    runs-on: ${{ matrix.os }}

    env:
      GHC_VERSION: ${{ matrix.ghc }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up GHC and cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: 'recommended'

      - name: Install dependencies via Homebrew
        run: |
          HOMEBREW_NO_AUTO_UPDATE=0 brew update --force
          brew install quantlib

      - name: Build
        run: cabal build all

      - name: Test
        run: cabal test all
