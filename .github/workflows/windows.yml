name: Windows

# Builds and tests hasquant natively on windows-latest, following the recipe in
# WINDOWS.md: build QuantLib itself with GHC's bundled clang++/libc++ (not
# MSYS2's GCC/libstdc++), then compile the cbits shim and link the whole thing
# against that same toolchain. MSYS2 is used only for Boost's headers, cmake,
# and ninja -- never for its own C++ compiler, and MSYS2's math.h/stdlib.h are
# never put on the include path (see WINDOWS.md's "Step 1" note on why not).
#
# The QuantLib build (~976 translation units, ~35 min) is cached across runs;
# bump the cache key's trailing version suffix to force a rebuild.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        ghc: ["9.10.3", "9.14.1"]

    env:
      QL_VERSION: "1.43"
      BOOST_INC: ${{ github.workspace }}\boost-inc
      QL_INSTALL: ${{ github.workspace }}\QuantLib-ghc
      GHC_VERSION: ${{ matrix.ghc }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up GHC and cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: latest

      # GHC bundles a complete Clang/libc++ toolchain under <ghc-root>/mingw --
      # that's what everything below is built and linked with, never MSYS2's GCC.
      - name: Locate GHC's bundled clang++ toolchain
        id: ghc-root
        shell: pwsh
        run: |
          $ghcExe = (ghcup whereis ghc $env:GHC_VERSION).Trim()
          $ghcBin = Split-Path $ghcExe -Parent
          $ghcRoot = Split-Path $ghcBin -Parent
          if (-not (Test-Path "$ghcRoot\mingw\bin\clang++.exe")) {
            throw "Expected GHC-bundled clang++ at $ghcRoot\mingw\bin\clang++.exe, not found"
          }
          "root=$ghcRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install Boost/cmake/ninja via MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      # WINDOWS.md Step 1: expose only Boost's headers, not all of
      # mingw64/include -- MSYS2's math.h/stdlib.h shadow libc++'s and produce
      # std::isnan/std::abs overload-resolution errors deep inside QuantLib.
      - name: Expose Boost headers only
        shell: cmd
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          mkdir "%BOOST_INC%"
          mklink /J "%BOOST_INC%\boost" "%MSYS2_ROOT%\mingw64\include\boost"

      - name: Cache built QuantLib
        id: cache-ql
        uses: actions/cache@v6
        with:
          path: ${{ env.QL_INSTALL }}
          key: quantlib-${{ env.QL_VERSION }}-ghc${{ env.GHC_VERSION }}-nopromote

      - name: Download QuantLib source
        if: steps.cache-ql.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/lballabio/QuantLib/releases/download/v$env:QL_VERSION/QuantLib-$env:QL_VERSION.tar.gz" -OutFile QuantLib.tar.gz
          tar -xzf QuantLib.tar.gz
          Rename-Item "QuantLib-$env:QL_VERSION" QuantLib-src

      # WINDOWS.md Step 2 ("Without MSYS2" cmake invocation, since we use MSYS2
      # only as a package source here, not as the shell/compiler).
      - name: Build and install QuantLib with GHC's clang++
        if: steps.cache-ql.outputs.cache-hit != 'true'
        shell: cmd
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          GHC_ROOT: ${{ steps.ghc-root.outputs.root }}
        run: |
          set "PATH=%MSYS2_ROOT%\mingw64\bin;%PATH%"
          mkdir QuantLib-src\build
          cd QuantLib-src\build
          cmake -G Ninja ^
            -DCMAKE_CXX_COMPILER=%GHC_ROOT:\=/%/mingw/bin/clang++.exe ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX=%QL_INSTALL:\=/% ^
            -DBoost_NO_BOOST_CMAKE=ON ^
            -DBoost_INCLUDE_DIR=%BOOST_INC:\=/% ^
            -DCMAKE_CXX_FLAGS="-include vector -DBOOST_MATH_PROMOTE_DOUBLE_POLICY=false" ^
            -DQL_BUILD_EXAMPLES=OFF ^
            -DQL_BUILD_TEST_SUITE=OFF ^
            ..
          ninja
          ninja install

      # WINDOWS.md Step 3: same flags as cabal.project.local.WINDOWS, with paths
      # resolved to this runner instead of the hardcoded h:/ example paths.
      - name: Write cabal.project.local
        shell: pwsh
        env:
          GHC_ROOT: ${{ steps.ghc-root.outputs.root }}
        run: |
          $ghc = $env:GHC_ROOT
          $mingw = "$ghc/mingw"
          $boost = $env:BOOST_INC
          $ql = $env:QL_INSTALL

          # Not a here-string: YAML's block indentation would land the closing
          # "@ mid-line, which PowerShell requires at column 0.
          $lines = @(
            "ignore-project: False"
            "tests: True"
            "with-compiler: $ghc/bin/ghc"
            "package hasquant"
            "  extra-include-dirs: $ql/include $boost"
            "  extra-lib-dirs: $ql/lib"
            "  ghc-options: -pgmcxx $mingw/bin/clang++ -optl $mingw/lib/libc++.a -optl $mingw/lib/libc++abi.a -optl $mingw/lib/libunwind.a -optcxx -isystem -optcxx $ql/include -optcxx-g -with-rtsopts=--generate-crash-dumps"
          )
          $lines -join "`n" | Out-File -FilePath cabal.project.local -Encoding utf8

      # WINDOWS.md Step 4.
      - name: Build
        shell: pwsh
        run: cabal build all --enable-tests -f buildExample -f buildSofrXva

      # Runs a stripped copy of the test binary, as a release build would, and keeps the
      # unstripped one for symbolizing crash offsets; stripping leaves section RVAs unchanged.
      - name: Stage test binaries
        shell: pwsh
        env:
          GHC_ROOT: ${{ steps.ghc-root.outputs.root }}
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          function Find-Tool([string[]] $names) {
            foreach ($dir in @("$env:GHC_ROOT\mingw\bin", "$env:MSYS2_ROOT\mingw64\bin")) {
              foreach ($n in $names) { if (Test-Path "$dir\$n") { return "$dir\$n" } }
            }
          }
          function Find-Tools {
            $script:strip = Find-Tool @("llvm-strip.exe", "strip.exe")
            $script:nm = Find-Tool @("llvm-nm.exe", "nm.exe")
            $script:objdump = Find-Tool @("llvm-objdump.exe", "objdump.exe")
          }
          function Invoke-Checked([string] $tool) {
            & $tool @args
            if ($LASTEXITCODE -ne 0) { throw "$tool failed with exit code $LASTEXITCODE" }
          }
          Find-Tools
          if (-not $strip -or -not $nm -or -not $objdump) {
            & "$env:MSYS2_ROOT\usr\bin\bash.exe" -lc "pacman -S --noconfirm --needed mingw-w64-x86_64-llvm-tools"
            Find-Tools
          }
          if (-not $strip -or -not $nm -or -not $objdump) { throw "No strip/nm/objdump tool found" }

          $exe = (cabal list-bin hasquant_test | Select-Object -Last 1).Trim()
          New-Item -ItemType Directory -Force ci-bin\unstripped, ci-bin\stripped, ci-dumps | Out-Null
          Copy-Item $exe ci-bin\unstripped\hasquant_test.exe
          Copy-Item $exe ci-bin\stripped\hasquant_test.exe
          Invoke-Checked $strip --strip-all ci-bin\stripped\hasquant_test.exe
          Invoke-Checked $nm -n --demangle ci-bin\unstripped\hasquant_test.exe > ci-bin\hasquant_test.map

          # Every section kept by strip must have the same size and address in both copies.
          $full = Invoke-Checked $objdump -h ci-bin\unstripped\hasquant_test.exe | Where-Object { $_ -match '^\s*\d+ ' }
          $kept = Invoke-Checked $objdump -h ci-bin\stripped\hasquant_test.exe | Where-Object { $_ -match '^\s*\d+ ' }
          $fullKeys = $full | ForEach-Object { ($_ -split '\s+' | Where-Object { $_ })[1..3] -join ' ' }
          foreach ($line in $kept) {
            $key = ($line -split '\s+' | Where-Object { $_ })[1..3] -join ' '
            if ($fullKeys -notcontains $key) { throw "Stripped section differs from unstripped: $key" }
          }
          if ((Get-Item ci-bin\stripped\hasquant_test.exe).Length -ge (Get-Item ci-bin\unstripped\hasquant_test.exe).Length) {
            throw "Stripped test binary is not smaller than the unstripped one"
          }
          Get-ChildItem ci-bin -Recurse -File | Format-Table Length, FullName

      # TMP/TEMP point the RTS crash minidump (written to GetTempPath) at ci-dumps.
      - name: Test
        shell: cmd
        run: |
          set "PATH=%QL_INSTALL%\bin;%QL_INSTALL%\lib;%PATH%"
          set "TMP=%GITHUB_WORKSPACE%\ci-dumps"
          set "TEMP=%GITHUB_WORKSPACE%\ci-dumps"
          ci-bin\stripped\hasquant_test.exe

      # On failure, and on every manual dispatch so the symbolization path stays exercised.
      - name: Upload test binaries
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-bin-ghc${{ matrix.ghc }}-attempt${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ci-bin
            ci-dumps
            ${{ env.QL_INSTALL }}\bin\*.dll
            ${{ env.QL_INSTALL }}\lib\*.dll
