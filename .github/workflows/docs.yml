name: Docs

# Builds Haddock API docs and an HPC coverage report (GHC 9.10.3 / QuantLib
# 1.44, pinned to lts-24.56 by cabal.project) inside the existing
# hasquant-ci image from linux.yml, and publishes them to the gh-pages branch
# root (docs) and gh-pages/coverage (HPC report), replacing previous contents.
# Runs after a successful Linux push run on master, which has built the image.

on:
  workflow_run:
    workflows: [Linux]
    types: [completed]
    branches: [master]
  workflow_dispatch:

jobs:
  publish-docs:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      GHC_VERSION: "9.10.3"
      QL_VERSION: "1.44"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve latest Boost version
        id: boost
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Same stable-only selection as linux.yml's resolve-boost.
          version=$(gh api 'repos/boostorg/boost/releases?per_page=100' --jq '
            .[] | select((.draft or .prerelease) | not)
                | select(.tag_name | test("^boost-[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9]+)?$"))
                | select(.tag_name as $t | any(.assets[]; .name == ($t + "-cmake.tar.gz")))
                | .tag_name' | sed 's/^boost-//' | sort -V | tail -1)
          if [ -z "$version" ]; then
            echo "No stable Boost release found" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Compute image tag
        id: tag
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=ghcr.io/${owner}/hasquant-ci:ql${{ env.QL_VERSION }}-boost${{ steps.boost.outputs.version }}-ghc${{ env.GHC_VERSION }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image
        run: docker pull "${{ steps.tag.outputs.tag }}"

      - name: Build Haddock docs
        run: |
          set -euo pipefail
          # The bind-mounted checkout is owned by the runner's uid, not the
          # image's baked-in dev uid.
          chmod -R 777 "$PWD"
          docker run --rm \
            -v "$PWD":/hasquant \
            -w /hasquant \
            "${{ steps.tag.outputs.tag }}" \
            sh -c "cabal update && cabal v2-haddock --enable-doc --haddock-hyperlink-source all"

      # Staged before coverage, which deletes hasquant's build directory.
      - name: Stage docs
        run: |
          set -euo pipefail
          docdir=$(find dist-newstyle -type d -path '*/doc/html/hasquant' | head -1)
          if [ -z "$docdir" ]; then
            echo "Could not find generated haddock output under dist-newstyle" >&2
            exit 1
          fi
          mkdir -p staged-docs
          cp -r "$docdir"/. staged-docs/

      - name: Build coverage report
        run: |
          set -euo pipefail
          # sudo: the prior Haddock step already left dist-newstyle owned by
          # the image's baked-in dev uid (created inside that docker run), not
          # the runner's uid, so a plain chmod here fails with "Operation not
          # permitted" on those paths.
          sudo chmod -R 777 "$PWD"
          docker run --rm \
            -v "$PWD":/hasquant \
            -w /hasquant \
            "${{ steps.tag.outputs.tag }}" \
            sh -c "cabal update && python3 tools/hpc-coverage.py"

      - name: Stage coverage report
        run: |
          set -euo pipefail
          # The test suite's report also covers the library modules.
          covdir=$(find dist-newstyle -name hpc_index.html -path '*hasquant_test*' -exec dirname {} \; | head -1)
          if [ -z "$covdir" ]; then
            echo "Could not find generated HPC coverage report under dist-newstyle" >&2
            exit 1
          fi
          mkdir -p staged-docs/coverage
          cp -r "$covdir"/. staged-docs/coverage/

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: staged-docs
          publish_branch: gh-pages
          keep_files: false
          commit_message: "Rebuild haddock docs and coverage report (CI)"
