name: Release

# On-demand release: checks out an existing tag, builds an sdist and
# hackage-ready Haddock docs (GHC 9.10.3 / QuantLib 1.43, matching stack.yaml's
# lts-24.53 resolver) inside the existing hasquant-ci image from linux.yml, and
# publishes both as assets on a GitHub Release for that tag. Defaults to
# creating the release as a draft (hidden from the public release list) so it
# can be reviewed before publishing with `gh release edit <tag> --draft=false`.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v.0.5.0.2)"
        required: true
        type: string
      draft:
        description: "Create as a draft (hidden until published)"
        required: false
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      GHC_VERSION: "9.10.3"
      QL_VERSION: "1.43"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Resolve latest Boost version
        id: boost
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/boostorg/boost/releases/latest --jq .tag_name)
          echo "version=${tag#boost-}" >> "$GITHUB_OUTPUT"

      - name: Compute image tag
        id: image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=ghcr.io/${owner}/hasquant-ci:ql${{ env.QL_VERSION }}-boost${{ steps.boost.outputs.version }}-ghc${{ env.GHC_VERSION }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image
        run: docker pull "${{ steps.image.outputs.tag }}"

      - name: Build sdist and hackage docs
        run: |
          set -euo pipefail
          # --allow-different-user: the bind-mounted checkout is owned by the
          # runner's uid, not the image's baked-in dev uid; safe to bypass in
          # this disposable single-use container (not shared multi-user state).
          chmod -R 777 "$PWD"
          docker run --rm \
            -v "$PWD":/hasquant \
            -w /hasquant \
            "${{ steps.image.outputs.tag }}" \
            sh -c "cabal update && cabal v2-haddock --haddock-for-hackage --enable-doc && cabal v2-sdist"

      - name: Locate build artifacts
        id: artifacts
        run: |
          set -euo pipefail
          sdist=$(find dist-newstyle/sdist -name 'hasquant-*.tar.gz' | head -1)
          docs=$(find dist-newstyle -maxdepth 3 -name '*-docs.tar.gz' | head -1)
          if [ -z "$sdist" ] || [ -z "$docs" ]; then
            echo "Missing sdist or docs tarball under dist-newstyle" >&2
            exit 1
          fi
          echo "sdist=$sdist" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          set -euo pipefail
          ver="${{ inputs.tag }}"
          ver="${ver#v.}"
          ver="${ver#v}"
          awk -v ver="$ver" '
            $0 ~ "^## " ver " " { found=1; print; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${{ inputs.tag }}" > release-notes.md
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          sdist="${{ steps.artifacts.outputs.sdist }}"
          docs="${{ steps.artifacts.outputs.docs }}"
          draft_flag=()
          if [ "${{ inputs.draft }}" = "true" ]; then
            draft_flag=(--draft)
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            # Release already exists (e.g. re-running after a build fix): only
            # refresh its assets. Publish state is left alone -- flip it with
            # `gh release edit <tag> --draft=false` once you're happy with it.
            gh release upload "$tag" "$sdist" "$docs" --clobber
          else
            gh release create "$tag" "$sdist" "$docs" \
              --title "$tag" \
              --notes-file release-notes.md \
              "${draft_flag[@]}"
          fi
