name: Windows HestonSLV probe

# On-demand only. Reconstructs the HestonSLV fixture of
# QuantLib.Spec.PricingEngine's Windows-pending test in plain C++
# (tools/debug/hestonslv-probe.cpp) and prints the exact (t, df, ncp, q) that
# hestonslvfdmmodel.cpp's varianceMesher feeds to boost's
# quantile(non_central_chi_squared), so the call that throws on Windows -- and
# only on Windows -- can be identified from the log. It then runs the same probe
# sections -- which now include the MC model and SLV process the hspec test builds
# before the FDM one -- again from inside a GHC-hosted process (tools/debug/HestonSLVProbe.hs,
# base only -- hasquant is not built) and dumps the FP environment of both, since
# the standalone Windows run passes while the hasquant suite's identical call
# throws. With the `hasquant` input set it adds a third rung: lib:hasquant (only
# the library) plus a driver running the test body through hasquant's own
# bindings, outside hspec. This reuses the QuantLib cache the Windows workflow
# populates, so it is a few minutes on a cache hit and ~35 min otherwise.

on:
  workflow_dispatch:
    inputs:
      ghc:
        description: GHC whose bundled clang++/libc++ toolchain to build against
        type: choice
        default: "9.10.3"
        options: ["9.10.3", "9.14.1"]
      hasquant:
        description: Also build lib:hasquant and run the test body through it
        type: boolean
        default: true

jobs:
  probe:
    runs-on: windows-latest

    env:
      QL_VERSION: "1.43"
      BOOST_INC: ${{ github.workspace }}\boost-inc
      QL_INSTALL: ${{ github.workspace }}\QuantLib-ghc
      GHC_VERSION: ${{ inputs.ghc }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up GHC and cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: latest

      - name: Locate GHC's bundled clang++ toolchain
        id: ghc-root
        shell: pwsh
        run: |
          $ghcExe = (ghcup whereis ghc $env:GHC_VERSION).Trim()
          $ghcBin = Split-Path $ghcExe -Parent
          $ghcRoot = Split-Path $ghcBin -Parent
          if (-not (Test-Path "$ghcRoot\mingw\bin\clang++.exe")) {
            throw "Expected GHC-bundled clang++ at $ghcRoot\mingw\bin\clang++.exe, not found"
          }
          "root=$ghcRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install Boost/cmake/ninja via MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Report the MSYS2 boost version
        shell: msys2 {0}
        run: pacman -Qi mingw-w64-x86_64-boost | head -5

      - name: Expose Boost headers only
        shell: cmd
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          mkdir "%BOOST_INC%"
          mklink /J "%BOOST_INC%\boost" "%MSYS2_ROOT%\mingw64\include\boost"

      # Deliberately NOT windows.yml's key any more: that job now builds QuantLib with
      # BOOST_MATH_PROMOTE_DOUBLE_POLICY=false, which is the very behaviour this probe
      # exists to measure. The probe keeps a stock QuantLib, at the cost of its own
      # ~35 min build the first time.
      - name: Cache built QuantLib
        id: cache-ql
        uses: actions/cache@v6
        with:
          path: ${{ env.QL_INSTALL }}
          key: quantlib-${{ env.QL_VERSION }}-ghc${{ env.GHC_VERSION }}

      - name: Download QuantLib source
        if: steps.cache-ql.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/lballabio/QuantLib/releases/download/v$env:QL_VERSION/QuantLib-$env:QL_VERSION.tar.gz" -OutFile QuantLib.tar.gz
          tar -xzf QuantLib.tar.gz
          Rename-Item "QuantLib-$env:QL_VERSION" QuantLib-src

      - name: Build and install QuantLib with GHC's clang++
        if: steps.cache-ql.outputs.cache-hit != 'true'
        shell: cmd
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          GHC_ROOT: ${{ steps.ghc-root.outputs.root }}
        run: |
          set "PATH=%MSYS2_ROOT%\mingw64\bin;%PATH%"
          mkdir QuantLib-src\build
          cd QuantLib-src\build
          cmake -G Ninja ^
            -DCMAKE_CXX_COMPILER=%GHC_ROOT:\=/%/mingw/bin/clang++.exe ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX=%QL_INSTALL:\=/% ^
            -DBoost_NO_BOOST_CMAKE=ON ^
            -DBoost_INCLUDE_DIR=%BOOST_INC:\=/% ^
            -DCMAKE_CXX_FLAGS="-include vector" ^
            -DQL_BUILD_EXAMPLES=OFF ^
            -DQL_BUILD_TEST_SUITE=OFF ^
            ..
          ninja
          ninja install

      # Same toolchain and flags cabal.project.local gives the cbits shim, minus
      # the GHC link step: clang++ plus libc++, QuantLib and Boost as system
      # includes so their headers don't trip -Wall on the probe's own warnings.
      - name: Build the probe
        shell: cmd
        env:
          GHC_ROOT: ${{ steps.ghc-root.outputs.root }}
        run: |
          "%GHC_ROOT%\mingw\bin\clang++.exe" -std=c++17 -O2 -include vector ^
            -isystem "%QL_INSTALL%\include" -isystem "%BOOST_INC%" ^
            tools\debug\hestonslv-probe.cpp ^
            -L"%QL_INSTALL%\lib" -lQuantLib ^
            "%GHC_ROOT%\mingw\lib\libc++.a" "%GHC_ROOT%\mingw\lib\libc++abi.a" ^
            "%GHC_ROOT%\mingw\lib\libunwind.a" ^
            -o hestonslv-probe.exe

      # Never fails the job: the point is the log, and a throw is the expected
      # outcome here -- the probe catches and prints it rather than aborting.
      - name: Run the probe
        shell: cmd
        run: |
          set "PATH=%QL_INSTALL%\bin;%PATH%"
          hestonslv-probe.exe > hestonslv-probe.log 2>&1
          type hestonslv-probe.log

      # The same probe sections, called from a GHC-hosted process. The standalone
      # run above passes on Windows while the hasquant suite's identical libQuantLib
      # call throws, so this isolates the RTS: base only, no hasquant, no -threaded
      # (matching hasquant_test), with the FP environment dumped at each stage.
      - name: Build the RTS-hosted probe
        shell: cmd
        env:
          GHC_ROOT: ${{ steps.ghc-root.outputs.root }}
        run: |
          "%GHC_ROOT%\mingw\bin\clang++.exe" -std=c++17 -O2 -include vector ^
            -DHESTONSLV_PROBE_NO_MAIN -c ^
            -isystem "%QL_INSTALL%\include" -isystem "%BOOST_INC%" ^
            tools\debug\hestonslv-probe.cpp -o hsprobe.o
          ghc -O1 -outputdir hsprobe-out -o hestonslv-hsprobe.exe ^
            tools\debug\HestonSLVProbe.hs hsprobe.o ^
            -L"%QL_INSTALL%\lib" -lQuantLib ^
            -optl"%GHC_ROOT%\mingw\lib\libc++.a" ^
            -optl"%GHC_ROOT%\mingw\lib\libc++abi.a" ^
            -optl"%GHC_ROOT%\mingw\lib\libunwind.a"

      # Same driver, same object, linked with mingw's libmingwex ahead of whatever GHC
      # picks up. That library is where mingw-w64 supplies the 80-bit long double math
      # (ldexpl, logl, expl, powl, lgammal); if this build's part E reports
      # "yes (80-bit)" where the plain link reports "NO (collapsed)", the failure is a
      # link-order problem and the fix belongs in the Windows ghc-options, not in a test
      # skip.
      - name: Build the RTS-hosted probe with libmingwex
        shell: cmd
        env:
          GHC_ROOT: ${{ steps.ghc-root.outputs.root }}
        run: |
          dir "%GHC_ROOT%\mingw\lib\libmingwex.a"
          ghc -O1 -outputdir hsprobe-mx-out -o hestonslv-hsprobe-mingwex.exe ^
            tools\debug\HestonSLVProbe.hs hsprobe.o ^
            -L"%QL_INSTALL%\lib" -lQuantLib ^
            -optl-lmingwex ^
            -optl"%GHC_ROOT%\mingw\lib\libc++.a" ^
            -optl"%GHC_ROOT%\mingw\lib\libc++abi.a" ^
            -optl"%GHC_ROOT%\mingw\lib\libunwind.a"

      # Never fails the job, for the same reason as the standalone run.
      - name: Run the RTS-hosted probe
        shell: cmd
        run: |
          set "PATH=%QL_INSTALL%\bin;%PATH%"
          hestonslv-hsprobe.exe > hestonslv-hsprobe.log 2>&1
          type hestonslv-hsprobe.log

      - name: Run the RTS-hosted probe linked with libmingwex
        shell: cmd
        run: |
          set "PATH=%QL_INSTALL%\bin;%PATH%"
          hestonslv-hsprobe-mingwex.exe > hestonslv-hsprobe-mingwex.log 2>&1
          type hestonslv-hsprobe-mingwex.log

      # Third rung: the same fixture through hasquant's own bindings. Only lib:hasquant
      # is built -- not the test suite or examples -- and the driver runs outside hspec,
      # so a throw here isolates the cause to hasquant's path rather than libQuantLib,
      # the RTS, or the suite's randomized order.
      - name: Write cabal.project.local
        if: inputs.hasquant
        shell: pwsh
        env:
          GHC_ROOT: ${{ steps.ghc-root.outputs.root }}
        run: |
          $ghc = $env:GHC_ROOT
          $mingw = "$ghc/mingw"
          $lines = @(
            "ignore-project: False"
            "with-compiler: $ghc/bin/ghc"
            "package hasquant"
            "  extra-include-dirs: $env:QL_INSTALL/include $env:BOOST_INC"
            "  extra-lib-dirs: $env:QL_INSTALL/lib"
            "  ghc-options: -pgmcxx $mingw/bin/clang++ -optl $mingw/lib/libc++.a -optl $mingw/lib/libc++abi.a -optl $mingw/lib/libunwind.a -optcxx -isystem -optcxx $env:QL_INSTALL/include"
          )
          $lines -join "`n" | Out-File -FilePath cabal.project.local -Encoding utf8

      - name: Build lib:hasquant and the hasquant-linked probe
        if: inputs.hasquant
        shell: cmd
        env:
          GHC_ROOT: ${{ steps.ghc-root.outputs.root }}
        run: |
          cabal build lib:hasquant
          cabal exec -- ghc -O1 -outputdir hqprobe-out -o hestonslv-hqprobe.exe ^
            -package hasquant tools\debug\HestonSLVHasquant.hs hsprobe.o ^
            -L"%QL_INSTALL%\lib" -lQuantLib ^
            -optl"%GHC_ROOT%\mingw\lib\libc++.a" ^
            -optl"%GHC_ROOT%\mingw\lib\libc++abi.a" ^
            -optl"%GHC_ROOT%\mingw\lib\libunwind.a"

      # Never fails the job, for the same reason as the runs above.
      - name: Run the hasquant-linked probe
        if: inputs.hasquant
        shell: cmd
        run: |
          set "PATH=%QL_INSTALL%\bin;%PATH%"
          hestonslv-hqprobe.exe > hestonslv-hqprobe.log 2>&1
          type hestonslv-hqprobe.log

      - name: Upload the probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hestonslv-probe-${{ env.GHC_VERSION }}
          path: |
            hestonslv-probe.log
            hestonslv-hsprobe.log
            hestonslv-hsprobe-mingwex.log
            hestonslv-hqprobe.log
