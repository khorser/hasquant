name: hasquant
version: "0.2.5.0"
synopsis: Bindings to QuantLib
license: MIT
maintainer: Sergey Khorev <sergey.khorev@gmail.com>
copyright: (c) 2012-2022 Sergey Khorev
category: Finance
description: |
  Bindings to the QuantLib library.
github: khorser/hasquant
tested-with:
  - GHC == 8.10.6 # lts-18.8, older GHC 8.x actually worked as well
  - GHC == 9.0.2 # lts-19.30
  # also tested with lts-18.5 (ghc-8.10.4), lts-15.3 (ghc-8.8.2), lts-16.31 (ghc-8.8.4), lts-14.27 (ghc-8.6.5), lts-13.11 (ghc-8.6.3),
  # for ghc < 8.10 you need to add -P to cpp-options because some c2hs versions didn't like line markers like "# 0" in generated .i files
  # used to work with lts-6.35 (ghc-7.10.3) until I started using TemplateHaskell (there is no BangType in GHC-7.x and I can't be bothered with maintaining the compatibility)
language: Haskell2010
flags:
  buildExample:
    default: False
    manual: True
  trackAllocations:
    default: False
    manual: True

library:
  ghc-options: -Wall -Wredundant-constraints -Wmissing-exported-signatures -Widentities
  dependencies:
    - base >=4.9 && <5.0
    - time
    - template-haskell
    - split
  build-tools: c2hs
  exposed-modules:
    - QuantLib.Type
    - QuantLib.Math
    - QuantLib.Currency
    - QuantLib.Time.Date
    - QuantLib.Time.Calendar
    - QuantLib.Time.Schedule
    - QuantLib.Settings
    - QuantLib.InterestRate
    - QuantLib.Index
    - QuantLib.Instrument
    - QuantLib.Quote
    - QuantLib.TermStructure
    - QuantLib.TermStructure.Yield
    - QuantLib.TermStructure.Credit
    - QuantLib.TermStructure.Volatility
    - QuantLib.Index.InterestRate
    - QuantLib.CashFlow
    - QuantLib.Instrument.Bond
    - QuantLib.Instrument.CapFloor
    - QuantLib.Instrument.Forward
    - QuantLib.Process
    - QuantLib.Instrument.Option
    - QuantLib.Model
    - QuantLib.Instrument.Credit
    - QuantLib.Instrument.Swap
    - QuantLib.PricingEngine
  other-modules:
    - QuantLib.Internal
    - QuantLib.Internal.Enum
    - QuantLib.Internal.Syntax
    - QuantLib.Internal.CalendarEnum
    - QuantLib.Internal.Type
  extra-libraries:
    - QuantLib
    - stdc++
  cxx-sources:
    - cbits/qlTime.cpp
    - cbits/qlIndex.cpp
    - cbits/qlInstrument.cpp
    - cbits/qlLeg.cpp
    - cbits/qlMisc.cpp
    - cbits/qlModel.cpp
    - cbits/qlPricingEngineAux.cpp
    - cbits/qlPricingEngine.cpp
    - cbits/qlProcess.cpp
    - cbits/qlTermStructure.cpp
    - cbits/qlTermStructureAux.cpp
  include-dirs: cbits
  when:
    - condition: flag(trackAllocations)
      then:
        cxx-options: -Wall -Wextra -pedantic -DQLTRACK_ALLOCATIONS
      else:
        cxx-options: -Wall -Wextra -pedantic
tests:
  hasquant_test:
    dependencies:
      - base >= 4.9 && < 5.0
      - time
      - hspec
      - HUnit
      - QuickCheck
      - hasquant
    source-dirs: test
    other-modules:
      - QuantLib.Example.FRA
      - QuantLib.Example.Bond
      - QuantLib.Example.Repo
      - QuantLib.Example.Swap
      - QuantLib.Example.CDS
      - QuantLib.Example.BermudanSwaption
      - QuantLib.Example.Replication
      - QuantLib.Example.CallableBond
      - QuantLib.Example.ConvertibleBond
      - QuantLib.Example.EquityOption
    ghc-options: -Wall
    main: QuantLib/MainTest.hs
executables:
  hasquant_example:
    when:
      - condition: flag(buildExample)
        then:
          buildable: True
        else:
          buildable: False
    main: QuantLib/MainExample.hs
    other-modules:
      - QuantLib.Example.FRA
      - QuantLib.Example.Bond
      - QuantLib.Example.Repo
      - QuantLib.Example.Swap
      - QuantLib.Example.FittedBondCurve
      - QuantLib.Example.CDS
      - QuantLib.Example.BermudanSwaption
      - QuantLib.Example.Replication
      - QuantLib.Example.CallableBond
      - QuantLib.Example.ConvertibleBond
      - QuantLib.Example.EquityOption
    ghc-options: -Wall
    dependencies:
      - base >= 4.9 && < 5.0
      - time
      - hasquant
    source-dirs: test
