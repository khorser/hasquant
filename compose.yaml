# The image's dev user must match the host UID/GID that owns the bind-mounted
# working tree, or it can't write dist-newstyle. bash's $UID is
# read-only and not exported by default, so run e.g.
#   UID=$(id -u) GID=$(id -g) docker compose build
# or export UID/GID in your shell profile.
services:
  hasquant:
    build:
      context: .
    # target: development
      args:
        BOOST_VERSION: "1.92.0"
        QL_VERSION: "1.43"
        GHC_VERSION: "9.10.3"
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"

    image: hasquant:default
    user: "dev"
    platform: linux/amd64
    init: true
    working_dir: /hasquant
    container_name: hasquant-dev

    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

    volumes:
      - .:/hasquant:delegated
      - ghcup-root:/home/dev/.ghcup
      - cabal-root:/home/dev/.cabal
      - /hasquant/dist-newstyle
    stdin_open: true
    tty: true
    #environment:
    #  - TERM=dumb

volumes:
  ghcup-root:
    name: ghcup-root
  cabal-root:
    name: cabal-root
