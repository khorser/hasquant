services:
  hasquant:
    build:
      context: .
    # target: development
      args:
        BOOST_VERSION: "1.91.0-1"
        QL_VERSION: "1.43"
    
    image: hasquant:default
    platform: linux/amd64
    init: true
    working_dir: /hasquant
    container_name: hasquant-dev
    
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    
    volumes:
      - .:/hasquant:delegated
      - stack-root:/root/.stack
      - hasquant-work:/hasquant/.stack-work
    
    stdin_open: true
    tty: true
    #environment:
    #  - TERM=dumb
    #  - STACK_IN_CONTAINER=true

volumes:
  stack-root:
    name: stack-root
  hasquant-work:
    name: hasquant-work
